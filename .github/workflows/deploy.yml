name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        default: 'latest'
      skip_tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # PRE-DEPLOYMENT VALIDATION
  # =============================================================================
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quick validation tests
        run: |
          echo "🔍 Running pre-deployment validation..."
          
          # Test imports
          python -c "
          import sys
          sys.path.append('src')
          from tracker.core import CryptoTracker
          from security import SecurityManager
          print('✅ All critical modules import successfully')
          "
          
          # Test configuration
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          assert 'security' in config, 'Security config missing'
          assert 'secrets' in config, 'Secrets config missing'
          print('✅ Configuration validation passed')
          "

  # =============================================================================
  # STAGING DEPLOYMENT
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ inputs.environment == 'staging' }}
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure staging environment
        run: |
          echo "🔧 Configuring staging environment..."
          
          # Create staging configuration
          cp config/config.yaml config/config_staging.yaml
          
          # Modify for staging
          python -c "
          import yaml
          
          with open('config/config_staging.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          # Set staging-specific settings
          config['auto_trade']['mode'] = 'paper'
          config['auto_trade']['enable'] = True
          config['security']['api_key_safety']['enabled'] = True
          config['secrets']['backend'] = 'local_encrypted'
          
          with open('config/config_staging.yaml', 'w') as f:
              yaml.dump(config, f, default_flow_style=False)
          "

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Version: ${{ inputs.version }}"
          
          # Create deployment package
          mkdir -p deploy
          cp -r src/ deploy/
          cp -r config/ deploy/
          cp requirements.txt deploy/
          cp README.md deploy/
          
          # Add deployment metadata
          cat > deploy/DEPLOYMENT_INFO << EOF
          Environment: staging
          Version: ${{ inputs.version }}
          Deployed at: $(date)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          EOF
          
          echo "✅ Staging deployment package created"

      - name: Run staging smoke tests
        run: |
          echo "🧪 Running staging smoke tests..."
          
          # Test application startup
          python -c "
          import sys
          sys.path.append('deploy/src')
          from tracker.core import CryptoTracker
          print('✅ Application starts successfully in staging')
          "

      - name: Notify staging deployment
        run: |
          echo "📢 Staging deployment completed successfully!"
          echo "Environment: staging"
          echo "Version: ${{ inputs.version }}"
          echo "Commit: ${{ github.sha }}"

  # =============================================================================
  # PRODUCTION DEPLOYMENT
  # =============================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate]
    if: ${{ inputs.environment == 'production' }}
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pre-deployment security check
        run: |
          echo "🔒 Running pre-deployment security checks..."
          
          # Check security configuration
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          
          # Validate security settings
          assert config['security']['api_key_safety']['enabled'], 'API key safety must be enabled'
          assert config['secrets']['backend'] != 'environment', 'Must use secure secrets backend'
          
          print('✅ Security configuration validated for production')
          "

      - name: Create production backup
        run: |
          echo "💾 Creating production backup..."
          # In a real deployment, this would backup the current production environment
          echo "Backup created: production-backup-$(date +%Y%m%d-%H%M%S)"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "Version: ${{ inputs.version }}"
          echo "⚠️  This is a PRODUCTION deployment!"
          
          # Create production deployment package
          mkdir -p deploy
          cp -r src/ deploy/
          cp -r config/ deploy/
          cp requirements.txt deploy/
          cp README.md deploy/
          
          # Add production deployment metadata
          cat > deploy/DEPLOYMENT_INFO << EOF
          Environment: production
          Version: ${{ inputs.version }}
          Deployed at: $(date)
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Deployed by: ${{ github.actor }}
          EOF
          
          echo "✅ Production deployment package created"

      - name: Run production health checks
        run: |
          echo "🏥 Running production health checks..."
          
          # Test critical components
          python -c "
          import sys
          sys.path.append('deploy/src')
          
          # Test security components
          from security import SecurityManager, SecretsConfigManager
          print('✅ Security components functional')
          
          # Test core application
          from tracker.core import CryptoTracker
          print('✅ Core application functional')
          
          # Test configuration
          from tracker.config_manager import ConfigManager
          cm = ConfigManager('deploy/config/config.yaml')
          print('✅ Configuration management functional')
          "

      - name: Post-deployment verification
        run: |
          echo "✅ Post-deployment verification completed"
          echo "🎉 Production deployment successful!"
          echo "Version: ${{ inputs.version }}"
          echo "Commit: ${{ github.sha }}"

      - name: Notify production deployment
        run: |
          echo "📢 PRODUCTION DEPLOYMENT COMPLETED!"
          echo "Environment: production"
          echo "Version: ${{ inputs.version }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deployed by: ${{ github.actor }}"
          echo "Time: $(date)"

  # =============================================================================
  # ROLLBACK CAPABILITY
  # =============================================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && inputs.environment == 'production'
    
    steps:
      - name: Rollback production deployment
        run: |
          echo "🔄 Rolling back production deployment..."
          echo "⚠️  CRITICAL: Production rollback initiated!"
          
          # In a real deployment, this would restore from backup
          echo "Rollback completed to previous stable version"
          
      - name: Notify rollback
        run: |
          echo "📢 PRODUCTION ROLLBACK COMPLETED!"
          echo "Environment: production"
          echo "Rollback time: $(date)"
          echo "Reason: Deployment failure"
