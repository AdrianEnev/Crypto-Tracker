# Wallet Tracker Configuration
# Configuration for tracking the famous trader's Solana wallet

# API Keys are now loaded from environment variables (.env file)
# HELIUS_API_KEY and QUICKNODE_API_KEY are loaded from the main tracker .env file

wallet_tracking:
  # Target wallet and trader name are now loaded from environment variables
  # TARGET_WALLET_ADDRESS and TRADER_NAME in the main tracker .env file
  confidence_score: 0.9
  
  paper_trading:
    enabled: false  # Disable paper trading to enable Phantom integration
    initial_balance_usd: 1000  # Starting portfolio balance
    execution_delay_ms: 3000  # 3 second simulation delay
    position_size_pct: 0.1  # 10% of max_position_size_usd per trade
    alerts_enabled: true  # Show buy/sell alerts
    
  copy_trading:
    enabled: false  # Start with monitoring only
    max_position_size_usd: 1000 # Determines what part of the wallet's position size to copy
    buy_percentage_pct: 0.1  # 10% of tracked wallet's position size to buy
    delay_ms: 2000  # 2 second delay
    risk_management:
      max_drawdown_pct: 0.05
      stop_loss_pct: 0.1
      take_profit_pct: 0.5
      
  session_tracking:
    enabled: true
    save_directory: "sessions"  # Relative to wallet-tracker directory
    daily_summary: true  # Show today's P&L on shutdown
    graceful_shutdown: true  # Handle Ctrl+C properly
  
  monitoring:
    enabled: true
    check_interval_ms: 100  # 100ms polling for fast detection
    websocket_enabled: true
    max_concurrent_requests: 10
    
  alerts:
    enabled: true
    min_trade_size_usd: 100
    min_profit_potential_usd: 500
    alert_methods: ["console", "discord", "webhook"]
    
  copy_trading:
    enabled: false  # Start with monitoring only
    max_position_size_usd: 1000
    delay_ms: 2000  # 2 second delay to avoid front-running
    risk_management:
      max_drawdown_pct: 0.05
      stop_loss_pct: 0.1
      take_profit_pct: 0.5

# RPC Endpoints (priority order)
rpc_endpoints:
  primary:
    url: "https://api.mainnet-beta.solana.com"
    priority: 1
    websocket: false
