# Performance Settings
performance:
  max_detection_latency_ms: 1000  # Target: sub-second detection
  max_concurrent_transactions: 50
  batch_size: 10
  cache_ttl_seconds: 300

# Risk Management
risk_management:
  max_position_size_usd: 1000
  max_daily_trades: 100
  stop_loss_pct: 0.1
  take_profit_pct: 0.5
  max_drawdown_pct: 0.05
  
  # Copy trading limits
  copy_trading:
    enabled: false
    max_copy_amount_usd: 500
    min_confidence_score: 0.8
    delay_seconds: 2
    max_slippage_pct: 0.05

# Alert Settings
alerts:
  console:
    enabled: true
    show_detailed_info: true
  
  discord:
    enabled: false
    webhook_url: "YOUR_DISCORD_WEBHOOK_URL"
    mention_role: "@everyone"
  
  webhook:
    enabled: false
    url: "YOUR_WEBHOOK_URL"
    timeout_seconds: 10
  
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: "your_email@gmail.com"
    password: "your_app_password"
    to_addresses: ["alert@example.com"]

# Database Settings
database:
  path: "./data/wallet_trades.db"
  backup_interval_hours: 24
  max_backups: 7
  vacuum_interval_hours: 168  # Weekly

# Logging Settings
logging:
  level: "INFO"
  file_path: "./logs/wallet_tracker.log"
  max_file_size_mb: 100
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Development Settings
development:
  simulate_trades: true  # For testing without real transactions
  demo_mode: true
  verbose_logging: true
  performance_monitoring: true
