tracked_coins:
  bitcoin:
    symbol: btc
    name: Bitcoin
    threshold: 120000.0
    check_interval: 300
    strategy:
      name: 'mean_reversion'
      params:
        rsi_period: 14
        buy_threshold: 30
        sell_threshold: 70
  ethereum:
    symbol: eth
    name: Ethereum
    threshold: 5000.0
    check_interval: 300
    strategy:
      name: 'mean_reversion'
      params:
        rsi_period: 14
        buy_threshold: 30
        sell_threshold: 70
  solana:
    symbol: sol
    name: Solana
    threshold: 200.0
    check_interval: 300
    strategy:
      name: 'mean_reversion'
      params:
        rsi_period: 14
        buy_threshold: 30
        sell_threshold: 70

strategy:
  default_strategy: 'mean_reversion'
  use_regime_filter: false  # Disable regime filtering for testing
  vol_gate:
    min_atr_pct: 0.1        # Lower volatility threshold
    max_atr_pct: 20.0       # Higher max volatility
    min_reward_to_risk: 1.0 # Lower reward-to-risk requirement

# Copy other essential config sections from main config
price_providers:
  ccxt:
    enabled: true
    exchanges: ["binance"]
  cmc:
    enabled: false  # Disable to avoid rate limits
  coingecko:
    enabled: false  # Disable to avoid rate limits

risk_management:
  max_position_size: 0.1
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.15

execution:
  enabled: false  # Paper trading mode
  exchange: "binance"
  testnet: true

logging:
  level: "INFO"
  file: "logs/tracker.log"
