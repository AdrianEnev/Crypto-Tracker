tracked_coins:
  bitcoin:
    symbol: btc
    name: Bitcoin
    threshold: 120000.0
    check_interval: 300
    strategy:
      name: 'momentum'
      params:
        fast_ema_period: 12
        slow_ema_period: 26
        use_rsi: true
        rsi_period: 14
        rsi_max_buy: 70
        rsi_min_sell: 30
  ethereum:
    symbol: eth
    name: Ethereum
    threshold: 5000.0
    check_interval: 300
    strategy:
      name: 'momentum'
      params:
        fast_ema_period: 12
        slow_ema_period: 26
        use_rsi: true
        rsi_period: 14
        rsi_max_buy: 70
        rsi_min_sell: 30
  solana:
    symbol: sol
    name: Solana
    threshold: 200.0
    check_interval: 300
    strategy:
      name: 'momentum'
      params:
        fast_ema_period: 12
        slow_ema_period: 26
        use_rsi: true
        rsi_period: 14
        rsi_max_buy: 70
        rsi_min_sell: 30

strategy:
  default_strategy: 'momentum'
  use_regime_filter: true
  vol_gate:
    min_atr_pct: 1.0
    max_atr_pct: 10.0
    min_reward_to_risk: 1.3

# Copy other essential config sections from main config
price_providers:
  ccxt:
    enabled: true
    exchanges: ["binance"]
  cmc:
    enabled: true
    api_key: null
  coingecko:
    enabled: true
    api_key: null

risk_management:
  max_position_size: 0.1
  stop_loss: 0.02
  take_profit: 0.04
  max_drawdown: 0.15

execution:
  enabled: false  # Paper trading mode
  exchange: "binance"
  testnet: true

logging:
  level: "INFO"
  file: "logs/tracker.log"
