# config/paper_24_7_optimized.yaml
# Optimized configuration for 24/7 paper trading - Real-world viable settings

# =============================================================================
# PORTFOLIO ALLOCATION CONFIGURATION
# =============================================================================
# These settings control how your portfolio is allocated across different assets
# You can customize these based on your risk tolerance and investment strategy

portfolio_allocation:
  # Bitcoin allocation as percentage of total crypto portfolio
  # Conservative: 70-80%, Moderate: 50-60%, Aggressive: 30-40%
  bitcoin_allocation_pct: 60.0
  
  # Ethereum allocation as percentage of total crypto portfolio  
  # Conservative: 20-30%, Moderate: 30-40%, Aggressive: 40-50%
  ethereum_allocation_pct: 30.0
  
  # Other altcoins allocation as percentage of total crypto portfolio
  # Conservative: 0-10%, Moderate: 10-20%, Aggressive: 20-30%
  altcoins_allocation_pct: 10.0
  
  # Rebalancing settings
  rebalancing:
    enabled: true
    threshold_pct: 10.0  # Rebalance when allocation drifts ±10% from target
    min_interval_days: 30  # Minimum days between rebalancing
    max_rebalance_pct: 5.0  # Maximum % of portfolio to rebalance at once

# =============================================================================
# RISK PROFILE CONFIGURATION
# =============================================================================
# Choose your risk profile: conservative, moderate, aggressive, or custom

risk_profile: "moderate"  # Options: conservative, moderate, aggressive, custom

# Risk profile presets (automatically applied when risk_profile is set)
risk_presets:
  conservative:
    bitcoin_allocation_pct: 75.0
    ethereum_allocation_pct: 20.0
    altcoins_allocation_pct: 5.0
    use_advanced_strategies: false
    use_derivatives_signals: false
    use_onchain_signals: false
    max_position_size_pct: 5.0
    risk_per_trade_pct: 0.5
    
  moderate:
    bitcoin_allocation_pct: 60.0
    ethereum_allocation_pct: 30.0
    altcoins_allocation_pct: 10.0
    use_advanced_strategies: true
    use_derivatives_signals: true
    use_onchain_signals: true
    max_position_size_pct: 10.0
    risk_per_trade_pct: 1.0
    
  aggressive:
    bitcoin_allocation_pct: 40.0
    ethereum_allocation_pct: 40.0
    altcoins_allocation_pct: 20.0
    use_advanced_strategies: true
    use_derivatives_signals: true
    use_onchain_signals: true
    max_position_size_pct: 15.0
    risk_per_trade_pct: 2.0

# =============================================================================
# ADVANCED STRATEGIES CONFIGURATION
# =============================================================================
# These are optional advanced features that can be enabled/disabled
# Set to false if you prefer simpler, more traditional strategies

advanced_strategies:
  # Bitcoin-specific advanced strategies
  bitcoin_multi_bucket:
    enabled: true  # Set to false to use simple momentum/mean_reversion
    core_hodl_enabled: true
    dip_ladder_enabled: true
    momentum_overlay_enabled: true
    mean_reversion_enabled: true
    regime_awareness_enabled: true
    
  # Ethereum-specific advanced strategies  
  ethereum_staking_trading:
    enabled: true  # Set to false to use simple momentum/mean_reversion
    staking_bucket_enabled: true
    utility_trading_enabled: true
    volatility_arbitrage_enabled: true
    network_event_awareness_enabled: true
    
  # System-wide advanced features
  derivatives_integration:
    enabled: true  # Set to false to disable funding rates, basis, options
    funding_rate_signals: true
    basis_signals: true
    options_signals: true
    
  onchain_metrics:
    enabled: true  # Set to false to disable exchange flows, active addresses
    exchange_flow_signals: true
    active_addresses_signals: true
    whale_movement_signals: true
    
  volatility_regime_classification:
    enabled: true  # Set to false to use fixed parameters
    use_clustering: true
    parameter_switching: true

# =============================================================================
# COIN-SPECIFIC CONFIGURATION
# =============================================================================

tracked_coins:
  bitcoin:
    symbol: btc
    name: Bitcoin
    threshold: 100000.0
    check_interval: 300
    coingecko_id: bitcoin
    
    # Strategy selection - can be simple or advanced
    strategy:
      name: bitcoin_multi_bucket  # Options: momentum, mean_reversion, bitcoin_multi_bucket
      params:
        # Core HODL allocation (only used if bitcoin_multi_bucket strategy)
        core_allocation_pct: 60.0
        core_rebalance_threshold: 10.0
        
        # Tactical accumulation ladder (only used if bitcoin_multi_bucket strategy)
        dip_ladder_enabled: true
        dip_levels: [5.0, 10.0, 20.0, 35.0, 50.0]
        dip_weights: [0.4, 0.3, 0.2, 0.1, 0.0]
        exchange_flow_filter: true
        
        # Momentum + mean reversion overlay (only used if bitcoin_multi_bucket strategy)
        momentum_enabled: true
        momentum_ema_period: 50
        momentum_rsi_range: [40, 70]
        momentum_vol_slope_period: 30
        
        mean_reversion_enabled: true
        mr_dip_threshold: [5.0, 12.0]
        mr_rsi_threshold: 30
        mr_profit_target: [5.0, 12.0]
        mr_stop_loss: [8.0, 15.0]
        
        # Volatility-aware stops
        atr_period: 14
        atr_multiplier: 3.0
        
        # Cycle/macro awareness
        halving_aware: true
        macro_regime_filter: true
        
        # Simple strategy parameters (used if strategy is momentum or mean_reversion)
        fast_ema_period: 12
        slow_ema_period: 26
        rsi_period: 14
        rsi_max_buy: 65
        rsi_min_sell: 35
        
    risk:
      atr:
        period: 14
        sl_mult: 1.5
        tp_mult: 3.0
    market: BTC/USDT
    
  ethereum:
    symbol: eth
    name: Ethereum
    threshold: 5000.0
    check_interval: 300
    coingecko_id: ethereum
    
    # Strategy selection - can be simple or advanced
    strategy:
      name: ethereum_staking_trading  # Options: momentum, mean_reversion, ethereum_staking_trading
      params:
        # Staking bucket (only used if ethereum_staking_trading strategy)
        staking_allocation_pct: 35.0
        staking_yield_target: 3.5
        lst_monitoring_enabled: true
        lst_peg_threshold: 0.5
        
        # Active trading bucket (only used if ethereum_staking_trading strategy)
        trading_enabled: true
        trading_risk_per_trade: 0.8
        trading_atr_multiplier: 3.5
        max_trading_exposure: 25.0
        
        # Utility/activity-aware features (only used if ethereum_staking_trading strategy)
        onchain_metrics_enabled: true
        gas_usage_weight: 0.3
        active_addresses_weight: 0.3
        defi_tvl_weight: 0.4
        
        # Volatility and options awareness (only used if ethereum_staking_trading strategy)
        volatility_arbitrage_enabled: true
        iv_rv_ratio_threshold: 1.2
        options_hedge_threshold: 0.8
        
        # Network event awareness (only used if ethereum_staking_trading strategy)
        upgrade_pause_enabled: true
        upgrade_risk_reduction: 0.5
        
        # Simple strategy parameters (used if strategy is momentum or mean_reversion)
        fast_ema_period: 12
        slow_ema_period: 26
        rsi_period: 14
        rsi_max_buy: 65
        rsi_min_sell: 35
        
    risk:
      atr:
        period: 14
        sl_mult: 1.2
        tp_mult: 2.5
    market: ETH/USDT
    
  solana:
    symbol: sol
    name: Solana
    threshold: 200.0
    check_interval: 300
    coingecko_id: solana
    strategy:
      name: momentum  # Simple strategy for altcoins
      params:
        fast_ema_period: 12
        slow_ema_period: 26
        use_rsi: true
        rsi_period: 14
        rsi_max_buy: 65
        rsi_min_sell: 35
        use_macd: true
        macd_fast: 12
        macd_slow: 26
        macd_signal: 9
    risk:
      atr:
        period: 14
        sl_mult: 1.0
        tp_mult: 2.0
    market: SOL/USDT

# =============================================================================
# SYSTEM CONFIGURATION
# =============================================================================

strategy:
  default_strategy: 'momentum'
  use_regime_filter: true
  vol_gate:
    min_atr_pct: 0.1
    max_atr_pct: 20.0
    min_reward_to_risk: 0.8

risk_management:
  max_daily_loss_pct: 5.0
  max_drawdown_pct: 15.0
  max_leverage: 1.0
  position_sizing:
    method: "atr_based"  # Options: fixed, atr_based, volatility_normalized
    risk_per_trade_pct: 1.0
    max_position_size_pct: 10.0

# =============================================================================
# DATA SOURCES CONFIGURATION
# =============================================================================

data_sources:
  price_providers:
    - coingecko
    - binance
    - ccxt
  
  derivatives_data:
    enabled: true
    providers:
      - binance_futures
      - deribit_options
  
  onchain_data:
    enabled: true
    providers:
      - dune_analytics  # Free on-chain data (replaces Glassnode)
      - santiment  # Free social + on-chain data (replaces CryptoQuant)
      - messari  # Free market data

# =============================================================================
# LOGGING AND MONITORING
# =============================================================================

logging:
  level: "INFO"
  file: "logs/trading.log"
  max_size_mb: 100
  backup_count: 5

monitoring:
  performance_tracking: true
  alert_thresholds:
    daily_loss_pct: 3.0
    drawdown_pct: 10.0
    allocation_deviation_pct: 15.0