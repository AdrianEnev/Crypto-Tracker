api:
  base_url: https://pro-api.coinmarketcap.com
  timeout: 10
data:
  provider: ccxt
  cache_dir: ./data_cache
  timeframe: 4h
  days: 365
auto_trade:
  enable: true
  mode: paper
decision:
  confidence_thresholds:
    suggestion: 0.5
    auto: 0.8
price:
  ttl_seconds: 15
paper:
  place_orders: true
  exits_enable: true
trade:
  default_size_usd: 50.0
liquidity:
  spread_bps_default: 10
risk:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  trailing_stop_pct: 0.04
  atr:
    period: 14
    sl_mult: 1.5
    tp_mult: 3.0
    trail_mult: 2.0
ui:
  price_format:
    thresholds:
    - 1.0
    - 0.1
    - 0.01
    precisions:
    - 2
    - 4
    - 6
    - 8
indicators:
  rsi_period: 14
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
strategy:
  use_regime_filter: false
execution:
  max_open_positions: 5
  per_coin_cooldown_seconds: 60
providers:
  sources:
  - cmc
  - coingecko
  - ccxt
  agreement_max_diff_pct: 0.5
  exchange: binance
testing:
  enabled: false
  force_auto_on_suggest: false
  global_price_offset_pct: 0.0
  per_coin_price_offset_pct: {}