api:
  base_url: https://pro-api.coinmarketcap.com
  timeout: 10
data:
  provider: ccxt
  cache_dir: ./data_cache
  timeframe: 4h
  days: 365
auto_trade:
  enable: true
  mode: paper
decision:
  confidence_thresholds:
    suggestion: 0.5
    auto: 0.8
    auto_bear: 0.95
price:
  ttl_seconds: 15
paper:
  place_orders: true
  exits_enable: true
trade:
  default_size_usd: 50.0
liquidity:
  spread_bps_default: 10
risk:
  stop_loss_pct: 0.03
  take_profit_pct: 0.06
  trailing_stop_pct: 0.04
  atr:
    period: 14
    sl_mult: 1.5
    tp_mult: 3.0
    trail_mult: 2.0
ui:
  # Display mode: 'minimal', 'standard', 'detailed', 'verbose'
  display_mode: 'standard'
  
  # What to show in the main display
  show_indicators: true          # Show RSI, EMA values
  show_market_structure: false   # Show HH/HL analysis
  show_mtf_confirmation: false   # Show multi-timeframe confirmation
  show_adaptive_baseline: false  # Show adaptive threshold calculations
  show_oco_details: false        # Show stop-loss/take-profit placement
  show_vol_gate_status: true     # Show volatility gate status
  show_regime_filter: true       # Show regime filter status
  
  # Decision display options
  decision_display:
    show_confidence: true        # Show confidence levels
    show_reasoning: true         # Show decision reasoning
    show_strategy_details: false # Show detailed strategy analysis
    max_reason_length: 100       # Max characters for reason display
  
  # Table display options
  table_display:
    enabled: true                # Enable table display (false = line-by-line format)
    show_portfolio_summary: true # Show portfolio summary
    show_risk_summary: true      # Show risk management info
    show_execution_status: true  # Show execution system status
    compact_mode: false          # Use compact table layout
    show_pnl_details: true       # Show P&L information
    table_format: 'standard'     # 'standard' or 'per_coin' - display format
  
  # Logging and output
  output:
    log_level: 'info'            # 'debug', 'info', 'warning', 'error'
    show_timestamps: false       # Show timestamps in console output
    color_output: true           # Use colored output
    progress_bars: true          # Show progress bars for long operations
  
  # Refresh and update intervals
  refresh:
    status_table_interval: 60    # Seconds between status table updates
    decision_display_interval: 5 # Seconds between decision updates
    portfolio_summary_interval: 300 # Seconds between portfolio summaries
  
  price_format:
    thresholds:
    - 1.0
    - 0.1
    - 0.01
    precisions:
    - 2
    - 4
    - 6
    - 8
indicators:
  rsi_period: 14
  ema_fast: 20
  ema_slow: 50
  atr_period: 14
strategy:
  default_strategy: 'mean_reversion'
  use_regime_filter: true
  vol_gate:
    min_atr_pct: 1.0     # block low-vol chop
    max_atr_pct: 10.0    # block panic regimes
    min_reward_to_risk: 1.3     # require R>=1.3
    min_tp_edge_bps: 30     #  require at least +30bps beyond fees+tax+spread
  # Optional: strategy default params (per-coin can override below)
  defaults:
    mean_reversion:
      rsi_period: 14
      buy_threshold: 30
      sell_threshold: 70
      use_bollinger: false
      bb_period: 20
      bb_stddev: 2.0
      require_confluence: true
    momentum:
      fast_ema_period: 12
      slow_ema_period: 26
      use_rsi: false
      rsi_period: 14
      rsi_max_buy: 70
      rsi_min_sell: 30
      use_macd: false
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
    breakout:
      bb_period: 20
      bb_stddev: 2.0
      squeeze_window: 100
      squeeze_pctile: 20.0
      volume_window: 20
      volume_mult: 1.5
      confirm_closes: 1
executor:
  retry_count: 3
  backoff_factor: 0.5
execution:
  max_open_positions: 5
  per_coin_cooldown_seconds: 60
  risk_budget_pct: 0.005     # 0.5% per entry
  # max_size_usd: 200.0      # optional cap
  # min_size_usd: 25.0       # optional floor
  fee_bps: 10        # 0.10% typical spot fee (adjust per venue/tier)
  tax_bps: 0         # country/platform ta
providers:
  sources:
  - cmc
  - coingecko
  - ccxt
  - websocket
  agreement_max_diff_pct: 0.5
  exchange: binance
testing:
  enabled: false
  force_auto_on_suggest: false
  global_price_offset_pct: 0.0
  per_coin_price_offset_pct: {}
optimize:
  folds: 3
  use_price_as_threshold: true
  disable_regime_filter: false
  disable_vol_gate: false
  skip_symbols: ["USDT", "USDC"]

# Order Management System Configuration
order_manager:
  enabled: true
  
  # Order limits and timeouts
  max_active_orders: 1000
  order_timeout_minutes: 60
  
  # Reconciliation settings
  reconciliation:
    enabled: true
    interval_minutes: 5
    auto_cancel_missing: false
  
  # Smart order routing
  routing:
    enabled: true
    preferred_exchanges: ["binance", "bybit", "coinbase"]
    liquidity_threshold: 10000  # USD
    max_slippage_bps: 50
    
  # TWAP (Time-Weighted Average Price) settings
  twap:
    min_slice_size_usd: 100
    max_slices: 20
    min_slice_interval_seconds: 30
    max_slice_interval_seconds: 300
    randomization_factor: 0.1
    
  # VWAP (Volume-Weighted Average Price) settings
  vwap:
    participation_rate: 0.1  # 10% of market volume
    max_participation_rate: 0.2  # Maximum 20% participation
    min_slice_size_usd: 100
    max_slice_size_usd: 10000
    volume_lookback_hours: 24
    slice_duration_minutes: 5
    randomization_factor: 0.05
    
  # Retry and error handling
  retry:
    max_attempts: 3
    base_delay_seconds: 1.0
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    jitter_range: 0.1
    
  # Circuit breaker settings
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    timeout_seconds: 60
    
  # Risk controls
  risk:
    max_order_size_usd: 10000
    max_daily_orders: 100
    position_size_limit_pct: 0.1  # 10% of portfolio

# Robust Risk Management Configuration
robust_risk:
  enabled: true
  strict_mode: false  # If true, blocks all trading on any violation
  
  # Portfolio-level risk limits
  portfolio_limits:
    max_exposure_per_coin_pct: 15.0      # Max 15% per coin
    max_total_exposure_pct: 80.0         # Max 80% total exposure
    max_open_positions: 8                # Max concurrent positions
    max_correlation_exposure_pct: 25.0   # Max exposure to correlated assets
  
  # Per-trade risk limits
  per_trade_limits:
    max_loss_pct_equity: 2.0             # Max 2% equity risk per trade
    max_position_size_pct: 10.0          # Max 10% of equity per position
    min_risk_reward_ratio: 1.5           # Minimum R:R ratio
  
  # Drawdown limits
  drawdown_limits:
    daily_max_drawdown_pct: 5.0          # 5% daily limit
    weekly_max_drawdown_pct: 12.0        # 12% weekly limit
    max_drawdown_pct: 20.0               # 20% absolute limit
    kill_switch_drawdown_pct: 15.0       # Kill switch at 15%
  
  # Leverage and margin limits
  leverage_limits:
    max_leverage: 3.0                    # Max 3x leverage
    margin_requirement_buffer: 1.2       # 20% buffer above margin req
    max_margin_utilization_pct: 75.0     # Max 75% margin used
  
  # Funding rate exposure limits
  funding_rate_limits:
    max_funding_rate_exposure: 0.01      # Max 1% funding rate cost
    funding_rate_cost_limit_daily: 0.005 # Max 0.5% daily funding cost
    perpetual_exposure_limit_pct: 50.0   # Max 50% in perpetuals
  
  # Risk monitoring configuration
  monitoring:
    risk_check_interval_seconds: 30      # Risk checks every 30s
    alert_thresholds:
      exposure_warning_pct: 70.0         # Warn at 70% exposure
      drawdown_warning_pct: 10.0         # Warn at 10% drawdown
      leverage_warning_pct: 80.0         # Warn at 80% leverage
  
  # Asset correlation matrix (example)
  correlation_matrix:
    BTC: {ETH: 0.8, LTC: 0.7, BCH: 0.6}
    ETH: {BTC: 0.8, DOT: 0.5, LINK: 0.6}
    LTC: {BTC: 0.7, BCH: 0.8}
    BCH: {BTC: 0.6, LTC: 0.8}
    DOT: {ETH: 0.5, LINK: 0.4}
    LINK: {ETH: 0.6, DOT: 0.4}
  
# Security Configuration
security:
  # API Key Safety Controls
  api_key_safety:
    enabled: true
    max_withdrawal_amount_usd: 1000.0
    required_ip_whitelist: true
    allowed_permission_levels: ["read_only", "trading_only"]
    validation_interval_hours: 24
    
    # Alerting
    alert_on_withdrawal_enabled: true
    alert_on_no_ip_whitelist: true
    alert_on_full_access: true
    
    # Exchange-specific settings
    exchange_settings:
      binance:
        require_subaccount: false
        max_api_keys: 5
        # TODO: Configure your Binance-specific settings
        # testnet: false
        # sandbox: false
        # ip_whitelist: []  # Add your IP addresses here
      coinbase:
        require_whitelist: true
        max_api_keys: 3
        # TODO: Configure your Coinbase-specific settings
        # sandbox: false
        # ip_whitelist: []  # Add your IP addresses here
      kraken:
        require_whitelist: true
        max_api_keys: 2
        # TODO: Configure your Kraken-specific settings
        # ip_whitelist: []  # Add your IP addresses here
  
  # Withdrawal Controls
  withdrawal_controls:
    enabled: true
    max_daily_withdrawal_usd: 5000.0
    require_manual_approval: true
    whitelisted_addresses: []  # TODO: Add your trusted withdrawal addresses
    blacklisted_addresses: []  # TODO: Add addresses to block
    
  # Monitoring
  monitoring:
    log_all_api_calls: true
    alert_on_permission_changes: true
    alert_on_new_api_keys: true
    security_report_interval_hours: 24

# Secrets Management Configuration
secrets:
  # Backend selection: local_encrypted, hashicorp_vault, aws_secrets_manager, gcp_secret_manager
  backend: "local_encrypted"
  
  # Local encrypted storage (DEFAULT FOR TESTING)
  local_encrypted:
    master_password_env: "SECRETS_MASTER_PASSWORD"  # Environment variable for master password
    storage_path: "./secrets"
    encryption_algorithm: "AES-256-GCM"
    # TODO: Set SECRETS_MASTER_PASSWORD in your .env file
  
  # HashiCorp Vault configuration (OPTIONAL)
  vault:
    url: "${VAULT_URL}"  # Environment variable
    token: "${VAULT_TOKEN}"  # Environment variable
    mount_point: "secret"
    namespace: ""  # Optional Vault namespace
    # TODO: Configure VAULT_URL and VAULT_TOKEN in your .env file
  
  # AWS Secrets Manager configuration (OPTIONAL)
  aws_secrets_manager:
    region: "us-east-1"
    profile: "default"  # AWS profile
    prefix: "crypto-tracker/"
    # TODO: Configure AWS credentials in your .env file
  
  # GCP Secret Manager configuration (OPTIONAL)
  gcp_secret_manager:
    project_id: "${GCP_PROJECT_ID}"
    credentials_path: "${GOOGLE_APPLICATION_CREDENTIALS}"
    prefix: "crypto-tracker/"
    # TODO: Configure GCP credentials in your .env file
  
  # Key rotation settings
  rotation:
    enabled: true
    interval_days: 30
    auto_rotate: false  # Manual rotation only for safety
    notify_before_days: 7
  
  # Access logging
  logging:
    log_access: true
    log_failed_access: true
    retention_days: 90

# =============================================================================
# TESTING CONFIGURATION FOR NEW SECURITY FEATURES
# =============================================================================

# Test API Keys (FOR TESTING ONLY - DO NOT USE IN PRODUCTION)
testing:
  # Enable testing mode (disables live trading)
  enabled: false
  
  # Test API keys (use paper trading keys or testnet keys)
  test_api_keys:
    binance:
      api_key: ""  # TODO: Add your Binance testnet API key
      secret: ""   # TODO: Add your Binance testnet secret
      testnet: true
    coinbase:
      api_key: ""  # TODO: Add your Coinbase sandbox API key
      secret: ""   # TODO: Add your Coinbase sandbox secret
      sandbox: true
  
  # Test security scenarios
  security_tests:
    # Test unsafe API key detection
    test_withdrawal_enabled: false
    test_no_ip_whitelist: false
    test_full_access: false
    
    # Test secrets management
    test_secrets_storage: true
    test_secrets_retrieval: true
    test_secrets_rotation: false

# =============================================================================
# LLM INTEGRATION CONFIGURATION
# =============================================================================
llm:
  # Enable LLM integration
  enabled: true
  
  # Primary LLM provider (openai, anthropic, google, cohere)
  provider: "openai"
  
  # Model selection
  model: "gpt-5-mini"  # Latest model with enhanced capabilities
  
  # API configuration (API key loaded from OPENAI_API_KEY environment variable)
  base_url: ""  # Optional custom base URL
  
  # Request parameters
  max_tokens: 4000
  temperature: 0.1  # Low temperature for consistent analysis
  timeout: 30
  max_retries: 3
  
  # Rate limiting
  rate_limit_per_minute: 60
  
  # Caching
  enable_caching: true
  cache_ttl_seconds: 300  # 5 minutes
  
  # Analysis configuration
  analysis:
    # Default analysis mode
    default_mode: "normal"  # normal, alert, crisis, emergency
    
    # Crisis detection thresholds
    crisis_thresholds:
      government_crisis: 0.8
      economic_crisis: 0.7
      regulatory_crisis: 0.8
      market_crisis: 0.9
    
    # Analysis frequency
    analysis_interval_minutes: 15  # How often to run comprehensive analysis
    crisis_check_interval_minutes: 5  # How often to check for crises
    
    # Integration settings
    integrate_with_decisions: true  # Use LLM analysis in trading decisions
    fallback_to_technical: true  # Fall back to technical analysis if LLM fails
  
  # Provider-specific settings
  providers:
    openai:
      model_options:
        - "gpt-5"  # Latest flagship model
        - "gpt-5-mini"  # Cheapest flagship model
        - "gpt-4o-mini"  # Cost-effective
        - "gpt-4o"  # Premium
        - "gpt-4-turbo"  # High-performance
      base_url: "https://api.openai.com/v1"
    
    anthropic:
      model_options:
        - "claude-3-5-sonnet-20241022"  # Best reasoning
        - "claude-3-haiku-20240307"  # Fast and cheap
      base_url: "https://api.anthropic.com/v1"
    
    google:
      model_options:
        - "gemini-pro"  # Google's model
      base_url: "https://generativelanguage.googleapis.com/v1beta"

# =============================================================================
# BACKTESTING CONFIGURATION
# =============================================================================
backtest:
  # Default backtest settings
  initial_capital: 10000.0
  commission: 0.001  # 0.1% commission
  slippage: 0.0005   # 0.05% slippage
  
  # Data settings
  start_date: "2023-01-01"
  end_date: "2024-01-01"
  
  # Strategy settings
  strategy: "rsi_ema"
  
  # Risk management
  max_position_size: 0.1  # 10% of capital per position
  stop_loss: 0.02  # 2% stop loss
  take_profit: 0.04  # 4% take profit

# =============================================================================
# QUICK START GUIDE FOR SECURITY FEATURES
# =============================================================================

# To enable security features:
# 1. Copy .env.example to .env (in project root)
# 2. Set SECRETS_MASTER_PASSWORD in .env
# 3. Add your API keys to .env (or use secrets manager)
# 4. Configure exchange-specific settings above
# 5. Test with: python scripts/security_manager.py validate binance --api-key YOUR_KEY --secret YOUR_SECRET
# 6. Store credentials: python scripts/security_manager.py store binance --api-key YOUR_KEY --secret YOUR_SECRET
# 7. Enable live trading by setting auto_trade.mode to "live" (only after testing!)

# =============================================================================
# Enhanced Features Configuration
# =============================================================================
enhanced_features:
  # Social Media Integration
  social_media:
    enabled: true
    sources: ["twitter", "reddit"]
    weight: 0.3
    confidence_boost: 0.1
    
  # LLM Integration  
  llm:
    enabled: true
    provider: "openai"
    model: "gpt-4"
    weight: 0.2
    confidence_boost: 0.15

# =============================================================================
# Monitoring and Error Recovery Configuration
# =============================================================================
monitoring:
  enabled: true
  heartbeat_interval_seconds: 300  # 5 minutes
  max_restarts: 10
  performance_tracking: true
  error_recovery: true

# =============================================================================
# Performance Metrics Configuration
# =============================================================================
performance_metrics:
  enabled: true
  track_trades_per_hour: true
  track_portfolio_performance: true
  track_system_health: true
  export_metrics: true
  metrics_export_interval_minutes: 60

# =============================================================================
# Parameter Optimization Configuration
# =============================================================================
optimization:
  enabled: false  # Enable for automated parameter tuning
  optimization_interval_hours: 24
  parameters_to_optimize:
    - "rsi_period"
    - "ema_fast"
    - "ema_slow"
    - "sl_mult"
    - "tp_mult"
    - "risk_budget_pct"
  optimization_trials: 100
  backtest_days: 30

# =============================================================================
# Enhanced Reporting Configuration
# =============================================================================
reporting:
  enabled: true
  enhanced_reports: true
  legacy_compatibility: true
  csv_export: true
  report_interval_hours: 24
  export_directory: "./reports"