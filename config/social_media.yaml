# Social Media Integration Configuration
# This file configures all social media features for the trading system.
# All features are disabled by default and must be explicitly enabled.

# Global settings
enabled: true  # Set to true to enable social media integration
debug: true  # Enable debug mode for testing
log_level: "DEBUG"

# Data source configurations
lunarcrush:
  enabled: false  # LunarCrush social metrics (PAID SERVICE - DISABLED)
  api_key: "${LUNARCRUSH_API_KEY}"  # Set in environment variables
  rate_limit: 1000  # Requests per hour
  timeout: 30
  retry_count: 3
  cache_ttl: 300  # 5 minutes cache
  priority: 1
  features:
    - "social_volume"
    - "sentiment_score"
    - "influencer_activity"

santiment:
  enabled: true  # Santiment social + on-chain data (ENABLED - USER HAS API KEY)
  api_key: "${SANTIMENT_API_KEY}"
  rate_limit: 500
  timeout: 30
  retry_count: 3
  cache_ttl: 300
  priority: 2
  features:
    - "social_volume"
    - "sentiment"
    - "on_chain_social"

glassnode:
  enabled: false  # Glassnode on-chain data
  api_key: "${GLASSNODE_API_KEY}"
  rate_limit: 100
  timeout: 30
  retry_count: 3
  cache_ttl: 600  # 10 minutes cache
  priority: 3
  features:
    - "exchange_flows"
    - "whale_movements"
    - "network_activity"

cryptoquant:
  enabled: false  # CryptoQuant exchange flows
  api_key: "${CRYPTOQUANT_API_KEY}"
  rate_limit: 200
  timeout: 30
  retry_count: 3
  cache_ttl: 600
  priority: 4
  features:
    - "exchange_netflow"
    - "funding_rates"
    - "futures_basis"

google_trends:
  enabled: true  # Google Trends (free, no API key needed)
  rate_limit: 100
  timeout: 30
  retry_count: 3
  cache_ttl: 3600  # 1 hour cache
  priority: 5
  features:
    - "search_volume"
    - "regional_interest"
    - "related_queries"

news_api:
  enabled: true  # News API for headline sentiment (ENABLED - USER HAS API KEY)
  api_key: "${NEWS_API_KEY}"
  rate_limit: 1000
  timeout: 30
  retry_count: 3
  cache_ttl: 300
  priority: 6
  features:
    - "headline_sentiment"
    - "mention_frequency"
    - "source_credibility"

twitter:
  enabled: true  # Twitter API for social metrics (FREE TIER - REPLACES LUNARCRUSH)
  api_key: "${TWITTER_API_KEY}"
  bearer_token: "${TWITTER_BEARER_TOKEN}"
  rate_limit: 1000  # Free tier: 10,000 tweets/month
  timeout: 30
  retry_count: 3
  cache_ttl: 300
  priority: 7
  features:
    - "social_volume"
    - "sentiment_score"
    - "engagement_score"
    - "influencer_activity"

reddit:
  enabled: true  # Reddit API for subreddit monitoring (FREE - REPLACES MORE LUNARCRUSH)
  client_id: "${REDDIT_CLIENT_ID}"
  client_secret: "${REDDIT_CLIENT_SECRET}"
  user_agent: "CryptoDiscoveryScanner/1.0"
  rate_limit: 60  # Reddit allows 60 requests per minute
  timeout: 30
  retry_count: 3
  cache_ttl: 300
  priority: 8
  subreddits:
    - "cryptocurrency"
    - "bitcoin"
    - "ethereum"
    - "cryptomarkets"
    - "cryptocurrencytrading"
  features:
    - "post_volume"
    - "sentiment_score"
    - "engagement_score"
    - "hot_topics"

# Feature engineering configuration
features:
  enabled: true  # Enable social feature engineering
  
  # Social Momentum Score (SMS) weights
  sms_weights:
    volume_velocity: 0.25
    weighted_sentiment: 0.30
    influencer_activity: 0.20
    network_centrality: 0.15
    bot_likeness: -0.10  # Negative weight for bot detection
    cross_validation: 0.20
  
  # Feature calculation parameters
  volume_window: 24  # Hours for volume calculations
  sentiment_window: 6  # Hours for sentiment calculations
  influencer_threshold: 10000  # Minimum followers for influencer status
  
  # Safety limits
  max_social_weight: 0.3  # Maximum weight social signals can have
  min_data_quality: 0.7  # Minimum data quality score required
  max_feature_age: 3600  # Maximum age of features in seconds

# Validation configuration
validation:
  enabled: true  # Enable social signal validation
  
  # Cross-validation requirements
  require_onchain_confirmation: true
  require_volume_confirmation: true
  require_derivatives_confirmation: false
  
  # Validation thresholds
  min_validation_score: 0.7
  min_onchain_correlation: 0.5
  min_volume_correlation: 0.3
  
  # Manipulation detection
  manipulation_detection: true
  coordination_threshold: 0.8
  bot_likeness_threshold: 0.7
  
  # Safety measures
  social_signal_cooldown: 300  # 5 minutes between social signals
  manipulation_penalty: 0.5  # Reduce confidence by 50% if manipulation detected

# ML integration configuration
ml_integration:
  enabled: false  # Enable ML model integration
  
  # Model configuration
  model_type: "ensemble"  # "technical_only", "social_enhanced", "ensemble"
  retrain_frequency: "daily"  # "hourly", "daily", "weekly"
  feature_importance_threshold: 0.05
  
  # Ensemble weights
  ensemble_weights:
    technical: 0.6
    social: 0.25
    onchain: 0.15
  
  # Safety limits
  max_ml_weight: 0.4  # Maximum weight ML can have in final decision
  min_training_samples: 1000
  max_model_age: 86400  # 24 hours

# Monitoring configuration
monitoring:
  enabled: true  # Enable monitoring and alerting
  
  # Dashboard configuration
  dashboard_enabled: true
  dashboard_port: 8080
  dashboard_refresh_interval: 60  # seconds
  
  # Alerting configuration
  alerts_enabled: true
  alert_channels:
    - "console"
    - "log"
  
  # Alert thresholds
  high_sentiment_threshold: 0.8
  manipulation_alert_threshold: 0.7
  volume_spike_threshold: 3.0  # 3x normal volume
  
  # Data retention
  log_retention_days: 30
  metrics_retention_days: 7
